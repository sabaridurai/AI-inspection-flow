server.port=8081
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.chat.options.model=openai/gpt-oss-120b

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/inspection}
spring.datasource.username=postgres
spring.datasource.password=root

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=inspectra-local
app.jwt.access-token-minutes=15

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://192.168.1.5:4200}
app.mail-credentials.encryption-key=${MAIL_CREDENTIALS_ENCRYPTION_KEY:}

app.auth.bootstrap-email=${AUTH_BOOTSTRAP_EMAIL:}
app.auth.bootstrap-password=${AUTH_BOOTSTRAP_PASSWORD:}
